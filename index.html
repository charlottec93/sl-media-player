<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <style>
        html, body, #player {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        #player {
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Invisible layer covering the whole video.
           Clicking anywhere turns sound on. */
        #soundButton {
            position: absolute;
            inset: 0;
            z-index: 10;
            border: 0;
            background: transparent;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div id="player"></div>

<button id="soundButton" aria-label="Turn on sound"></button>

<script>
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    var player;

    function onYouTubeIframeAPIReady() {

        player = new YT.Player('player', {

            videoId: 'ymPwall_CTw',

            playerVars: {
                autoplay: 1,
                mute: 1,
                controls: 0,
                loop: 1,
                playlist: 'ymPwall_CTw',
                playsinline: 1,
                rel: 0,
                origin: 'https://charlottec93.github.io'
            },

            events: {

                onReady: function(event) {
                    event.target.mute();
                    event.target.playVideo();
                },

                onStateChange: function(event) {

                    if (event.data === YT.PlayerState.ENDED) {
                        event.target.seekTo(0);
                        event.target.playVideo();
                    }
                }
            }
        });
    }

    document.getElementById('soundButton').addEventListener('click', function() {

        if (player && player.unMute) {
            player.unMute();
            player.setVolume(100);
            player.playVideo();

            // Remove invisible click layer afterward
            this.remove();
        }
    });
</script>

</body>
</html>
