<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>

<body>

<iframe
    src="https://www.youtube.com/embed/ymPwall_CTw?autoplay=1&mute=1&loop=1&playlist=ymPwall_CTw&controls=0&rel=0&playsinline=1"
    title="Second Life Media Player"
    allow="autoplay; encrypted-media"
    referrerpolicy="strict-origin-when-cross-origin">
</iframe>

</body>
</html>
