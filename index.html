<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <style>
        html, body, #player {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        #player {
            position: absolute;
            inset: 0;
        }

        #soundButton {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;

            padding: 12px 24px;
            border: 1px solid white;
            border-radius: 4px;

            background: rgba(0,0,0,0.65);
            color: white;

            font-family: Arial, sans-serif;
            font-size: 16px;
            letter-spacing: 2px;

            cursor: pointer;
        }

        #soundButton:hover {
            background: rgba(0,0,0,0.9);
        }
    </style>
</head>

<body>

<div id="player"></div>

<button id="soundButton">
    CLICK FOR SOUND
</button>

<script>
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    var player;

    function onYouTubeIframeAPIReady() {

        player = new YT.Player('player', {

            videoId: 'ymPwall_CTw',

            playerVars: {
                autoplay: 1,
                mute: 1,
                controls: 0,
                loop: 1,
                playlist: 'ymPwall_CTw',
                playsinline: 1,
                rel: 0,
                origin: 'https://charlottec93.github.io'
            },

            events: {

                onReady: function(event) {
                    event.target.mute();
                    event.target.playVideo();
                },

                onStateChange: function(event) {
                    if (event.data === YT.PlayerState.ENDED) {
                        event.target.seekTo(0);
                        event.target.playVideo();
                    }
                }
            }
        });
    }

    document.getElementById('soundButton')
        .addEventListener('click', function() {

            if (player && player.unMute) {

                player.unMute();
                player.setVolume(100);
                player.playVideo();

                // Button disappears once sound is enabled
                this.remove();
            }
        });
</script>

</body>
</html>
